# Mawjood CI — Phase B (reproducible foundation) + D-1 governance gates.
# Every push/PR must: install locked deps, typecheck, lint, run engine unit
# tests, prove all migrations apply on a FRESH database (incl. an idempotency
# re-run), prove RLS policies + auth gates hold, and build the web bundle.
# A migration that fails here never reaches a human's SQL editor.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# One running CI per branch/PR: a new push cancels the stale run instead of
# stacking two checks that disagree about what "green" meant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install (locked deps)
        run: npm ci

      - name: TypeScript — voice-engine
        run: npx tsc --noEmit -p packages/voice-engine

      - name: TypeScript — mobile
        run: npx tsc --noEmit -p apps/mobile

      - name: Lint — mobile
        run: npx expo lint
        working-directory: apps/mobile

      - name: Unit tests — shared engines
        # node strips TS types natively (no build step); deno-shim backs Deno.env
        run: node --import ./supabase/tests/deno-shim.mjs --test supabase/tests/unit.test.mjs

      - name: Eval — routing + memory corpora (Phase D)
        # 100% required: any red case is a behavior regression
        run: node supabase/tests/eval/run-eval.mjs

      - name: Migration check — fresh database
        # Also performs an idempotency re-run internally: applying the same
        # migrations twice must not error or change schema.
        run: node supabase/tests/migrate-check.mjs
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      - name: Web build
        run: npx expo export --platform web
        working-directory: apps/mobile

  secret-scan:
    # Scans the FULL git history, not just the working tree: a secret
    # committed (and later deleted) months ago is still in the repo.
    #
    # NOTE: gitleaks-action@v2 now requires a paid license for organization
    # repos, so we run the OSS gitleaks binary directly (Apache-2.0, same
    # engine, no license gate) with the identical flags + baseline config.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (OSS binary)
        run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.27.2/gitleaks_8.27.2_linux_x64.tar.gz \
            | tar xz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Secret scan (full history + baseline)
        # --log-opts="--all" makes detect walk every commit. The baseline
        # config documents reviewed historical false positives (Supabase
        # ANON key in old bundles, Apple Issuer ID, storage constants).
        # New leaks outside it still fail the job (exit code 1).
        run: gitleaks detect --redact --verbose --config .gitleaks.toml --log-opts="--all"

  vuln-scan:
    # NOTE: cannot be verified in the dev sandbox — the npm audit endpoint
    # is blocked there. CI runners are unrestricted, so this runs there.
    # Exit code: npm audit exits 1 when it finds >= --audit-level issues.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install (locked deps)
        run: npm ci

      - name: Audit — fail on NEW high+ vulnerabilities
        # Baseline (audit-baseline.json) pins the pre-existing Expo-toolchain
        # advisories (unfixable without breaking the Expo SDK pin); only NEW
        # high/critical advisories fail the gate. See scripts/audit-gate.mjs.
        run: node scripts/audit-gate.mjs

  rls-audit:
    # Runs the Row-Level Security audit against the SAME scratch database
    # the migration check builds: migrate first (builds mawjood_migtest),
    # then audit. Keeping both in one job avoids a second postgres service
    # and guarantees the audit sees the migrated schema.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install (locked deps)
        # pg is a root devDependency — the audit talks to the scratch DB
        run: npm ci


      - name: Build scratch database (migrate-check)
        run: node supabase/tests/migrate-check.mjs
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      - name: Spend-ledger concurrency proof
        run: node supabase/tests/spend-ledger-check.mjs
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      - name: Shopping status concurrency proof
        # Exercises migration 0051's parent-list row lock with two real
        # concurrent PostgreSQL sessions against the disposable migtest DB.
        run: node supabase/tests/shopping-concurrency-check.mjs
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      - name: RLS audit — policies hold on the migrated schema

        run: node supabase/tests/rls-audit.mjs
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      - name: Behavioral authorization tests — real RLS enforcement as simulated users
        # NOT a static audit: creates users/spaces/notes/items/files, then
        # queries AS those users (JWT-claims auth.uid()) and asserts actual
        # row visibility. See the file header for honest scope/limits.
        run: node supabase/tests/authz-behavioral.mjs
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  auth-gates:
    # Static audit of edge-function auth wiring (401/403/404 gating,
    # ownership proofs). No database needed — pure source analysis.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Auth gates check
        run: node supabase/tests/auth-gates-check.mjs

  e2e-smoke:
    # Playwright smoke test against the REAL Expo web export (not a mock):
    # installs chromium, builds the bundle, serves it, and asserts it loads
    # with HTTP 200, no uncaught errors, no failed same-origin assets, and
    # renders non-empty text.
    #
    # SCOPE (honest): smoke only. Full user journeys need a live backend
    # (Supabase auth/data); this proves the bundle is valid and servable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install (locked deps)
        run: npm ci

      - name: Install Playwright Chromium
        # --with-deps needs apt; sudo is available on ubuntu-latest runners
        run: npx playwright install --with-deps chromium

      - name: Web build
        # Plain export (same as the `ci` job): the smoke test only needs a
        # working bundle; no baseUrl rewriting here.
        # Dummy Supabase env: the bundle requires EXPO_PUBLIC_SUPABASE_* at
        # build time or createClient throws on load. These are placeholders —
        # the smoke test never hits a backend (see its SCOPE comment).
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-ci-smoke
        run: npx expo export --platform web
        working-directory: apps/mobile

      - name: Smoke test
        run: npx playwright test tests/e2e/smoke.spec.mjs --config=tests/e2e/playwright.config.mjs

  e2e-auth:
    # Authenticated user-journey tests against an ISOLATED local Supabase
    # stack (not production, not the dev project). Covers: magic-link
    # sign-in via Inbucket, authenticated app boot, note creation through
    # the data API, UI retrieval, two-user isolation, and navigation.
    #
    # SCOPE (honest): the AI chat/extract/memory journeys are NOT covered —
    # they need the `chat`/`extract` edge functions + OPENAI_API_KEY, which
    # CI does not have. Documented as an explicit gap, not a PASS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          # Pinned (not "latest"): resolving "latest" calls the GitHub API
          # unauthenticated and failed on rate limit (run 38263560994,
          # 2026-10-12). Pinning is reproducible and skips that call.
          version: 2.120.0

      - name: Init + start local Supabase
        # supabase/ has no config.toml (only functions/migrations/tests);
        # init scaffolds the default config, then we point auth redirects
        # at the Playwright webServer port. Minimal stack: db + auth + rest
        # + inbucket (mail catcher for magic links) + kong gateway.
        run: |
          supabase init
          python3 - <<'EOF'
          import re
          p = 'supabase/config.toml'
          t = open(p).read()
          t = t.replace('localhost:3000', 'localhost:8901')
          # ensure the app URL is an allowed auth redirect (idempotent)
          if 'additional_redirect_urls' not in t:
              t = t.replace('[auth]', '[auth]\nadditional_redirect_urls = ["http://localhost:8901/**"]', 1)
          elif 'localhost:8901' not in t.split('additional_redirect_urls')[1].split('\n')[0]:
              t = re.sub(r'(additional_redirect_urls\s*=\s*\[)',
                          r'\1"http://localhost:8901/**", ', t, count=1)
          open(p, 'w').write(t)
          print('config patched')
          EOF
          supabase start -x realtime,storage-api,imgproxy,edge-runtime,logflare,vector,supavisor,studio

      - name: Apply migrations to local Supabase
        # `migration up` (not `db push`): applies supabase/migrations/ to the
        # LOCAL database. `db push` targets hosted projects and needs a token.
        run: supabase migration up

      - name: Capture local Supabase credentials
        id: sb
        run: |
          STATUS_JSON="$(supabase status -o json)"
          echo "url=$(echo "$STATUS_JSON" | jq -r '.API_URL')" >> "$GITHUB_OUTPUT"
          echo "anon=$(echo "$STATUS_JSON" | jq -r '.ANON_KEY')" >> "$GITHUB_OUTPUT"
          echo "service=$(echo "$STATUS_JSON" | jq -r '.SERVICE_ROLE_KEY')" >> "$GITHUB_OUTPUT"

      - name: Install (locked deps)
        run: npm ci

      - name: Web build (pointed at local Supabase)
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ steps.sb.outputs.url }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.sb.outputs.anon }}
        run: npx expo export --platform web
        working-directory: apps/mobile

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Authenticated journey tests
        env:
          MAWJOOD_TEST_SUPABASE_URL: ${{ steps.sb.outputs.url }}
          MAWJOOD_TEST_SUPABASE_ANON_KEY: ${{ steps.sb.outputs.anon }}
          MAWJOOD_TEST_SUPABASE_SERVICE_KEY: ${{ steps.sb.outputs.service }}
        run: npx playwright test tests/e2e/auth-journey.spec.mjs --config=tests/e2e/playwright.config.mjs

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  standards:
    # Heuristic engineering-standards checks (module boundaries, error
    # envelopes, privacy-safe logging). See
    # docs/autonomous/ENGINEERING_STANDARDS.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Standards check
        run: node scripts/standards-check.mjs

  provenance:
    # Exact-commit verification: the CI result must be attributable to ONE
    # exact SHA. Fails on a dirty checkout (status --porcelain non-empty)
    # or whitespace errors (git diff --check).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify clean checkout + record exact SHA
        run: |
          set -e
          if [ -n "$(git status --porcelain)" ]; then
            echo "FAIL: checkout is dirty"
            git status --porcelain
            exit 1
          fi
          git diff --check
          echo "### EXACT_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
