<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#faf7f2" />
    <title>Join a Mawjood family</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #17181c; background: #faf7f2; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 440px); padding: 32px 24px; border: 1px solid #e7e3dc; border-radius: 24px; background: #fff; text-align: center; box-shadow: 0 12px 36px #17181c0d; }
      .mark { font-size: 42px; }
      h1 { margin: 10px 0 8px; font-size: 27px; }
      p { color: #626773; line-height: 1.55; }
      .code { margin: 22px 0; padding: 16px; border-radius: 14px; background: #f2f3f5; font: 700 25px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; overflow-wrap: anywhere; }
      a, button { display: block; width: 100%; margin-top: 12px; padding: 14px 18px; border: 0; border-radius: 14px; font: inherit; font-weight: 650; text-decoration: none; cursor: pointer; }
      a { color: #fff; background: #17181c; }
      button { color: #30333a; background: #f2f3f5; }
      #status { min-height: 24px; margin-bottom: 0; font-size: 14px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">👨‍👩‍👧</div>
      <h1 id="title">Join a Mawjood family</h1>
      <p id="description">Open this invitation in Mawjood, or copy the code and enter it in the app.</p>
      <div class="code" id="code" aria-label="Family invitation code"></div>
      <a id="open" href="#">Open in Mawjood</a>
      <button id="copy" type="button">Copy invitation code</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const raw = params.get('code') || '';
        const code = /^[A-Za-z0-9]{6,10}$/.test(raw) ? raw.toUpperCase() : '';
        const rtl = /^ar\b/i.test(navigator.language || '');
        document.documentElement.lang = rtl ? 'ar' : 'en';
        document.documentElement.dir = rtl ? 'rtl' : 'ltr';
        document.getElementById('title').textContent = rtl ? 'انضم إلى عائلة موجود' : 'Join a Mawjood family';
        document.getElementById('description').textContent = rtl
          ? 'افتح الدعوة في تطبيق موجود، أو انسخ الرمز وأدخله داخل التطبيق.'
          : 'Open this invitation in Mawjood, or copy the code and enter it in the app.';
        document.getElementById('copy').textContent = rtl ? 'انسخ رمز الدعوة' : 'Copy invitation code';
        const display = document.getElementById('code');
        const open = document.getElementById('open');
        const copy = document.getElementById('copy');
        const status = document.getElementById('status');
        if (!code) {
          display.textContent = rtl ? 'رابط الدعوة غير صالح' : 'Invalid invitation link';
          open.hidden = true;
          copy.hidden = true;
          return;
        }
        display.textContent = code;
        const appUrl = `mawjood://family/join?code=${encodeURIComponent(code)}`;
        open.href = appUrl;
        copy.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(code);
            status.textContent = rtl ? 'تم نسخ الرمز' : 'Code copied';
          } catch {
            const field = document.createElement('textarea');
            field.value = code;
            field.setAttribute('readonly', '');
            field.style.position = 'fixed';
            field.style.opacity = '0';
            document.body.appendChild(field);
            field.select();
            const copied = document.execCommand('copy');
            field.remove();
            status.textContent = copied
              ? (rtl ? 'تم نسخ الرمز' : 'Code copied')
              : (rtl ? 'حدد الرمز وانسخه يدويًا' : 'Select and copy the code manually');
          }
        });
      })();
    </script>
  </body>
</html>
