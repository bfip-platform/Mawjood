<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mawjood — UX Correction Review · Chat-First Architecture, v1.2 Styling</title>
<style>
/* ============ v1.2 TOKENS — monochrome-first ============ */
:root, [data-theme="light"]{
  --bg:#FFFFFF; --s1:#FFFFFF; --s2:#F5F5F6; --ssoft:#F9F9FA;
  --bd:#E7E7EA; --bdsoft:#F0F0F2;
  --t1:#0A0A0B; --t2:#52525B; --t3:#71717A;
  --ac:#0A0A0B; --ac-tx:#FFFFFF;
  --blue:#3B82C4; --blue-tx:#2F6FA8; --blue-soft:#EAF2FB;
  --sage:#5E7E63; --sage-soft:#EDF3EE;
  --sh1:0 1px 2px rgba(10,10,11,.05); --sh2:0 4px 16px rgba(10,10,11,.07); --sh3:0 12px 32px rgba(10,10,11,.12);
  --scrim:rgba(10,10,11,.45);
}
[data-theme="dark"]{
  --bg:#0A0A0B; --s1:#141416; --s2:#1C1C1F; --ssoft:#18181B;
  --bd:#2A2A2E; --bdsoft:#232327;
  --t1:#F5F5F4; --t2:#C9C9CE; --t3:#A1A1AA;
  --ac:#FFFFFF; --ac-tx:#0A0A0B;
  --blue:#7FB2E5; --blue-tx:#9CC4EC; --blue-soft:#1B2A3A;
  --sage:#8FAE93; --sage-soft:#1E2B22;
  --sh1:0 1px 2px rgba(0,0,0,.4); --sh2:0 4px 16px rgba(0,0,0,.45); --sh3:0 12px 32px rgba(0,0,0,.55);
  --scrim:rgba(10,10,11,.55);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,'IBM Plex Sans Arabic',system-ui,sans-serif;background:var(--ssoft);color:var(--t1);transition:background .25s,color .25s}
[dir="rtl"] body{font-family:'IBM Plex Sans Arabic',Inter,system-ui,sans-serif}
/* review chrome */
.hdr{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);padding:14px 28px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.mark{width:36px;height:36px;border-radius:11px;background:var(--ac);color:var(--ac-tx);display:grid;place-items:center;font-weight:800;font-size:20px}
.brand{display:flex;align-items:center;gap:12px}.hdr h1{font-size:17px;font-weight:700}.hdr .sub{font-size:12px;color:var(--t3)}
.ctl{display:flex;gap:8px;margin-inline-start:auto;flex-wrap:wrap}
.seg{display:flex;background:var(--s2);border:1px solid var(--bd);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--t2);font:inherit;font-size:13px;font-weight:600;padding:7px 14px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--ac);color:var(--ac-tx)}
.note{max-width:1180px;margin:26px auto 0;padding:0 28px;font-size:14px;color:var(--t2);line-height:1.75}.note b{color:var(--t1)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--s2);border:1px solid var(--bd);color:var(--t2)}
.chip.blue{background:var(--blue-soft);color:var(--blue-tx);border-color:transparent}.chip.sage{background:var(--sage-soft);color:var(--sage);border-color:transparent}
.wrap{max-width:1180px;margin:0 auto;padding:28px}
.sec{margin:44px 0}.sec-h{display:flex;align-items:baseline;gap:14px;margin-bottom:8px}
.sec-h h2{font-size:24px;font-weight:700;letter-spacing:-.02em}.sec-h .n{font-size:13px;font-weight:700;color:var(--t3);letter-spacing:.08em}
.sec p.d{font-size:14px;color:var(--t2);line-height:1.7;margin-bottom:20px;max-width:72ch}
.stage{display:grid;gap:22px}.stage.cols2{grid-template-columns:1.4fr 1fr}
@media(max-width:900px){.stage.cols2{grid-template-columns:1fr}}
.frame{border:1px solid var(--bd);border-radius:18px;overflow:hidden;background:var(--bg);box-shadow:var(--sh2)}
.frame .tag{padding:10px 16px;font-size:12px;font-weight:600;color:var(--t3);border-bottom:1px solid var(--bdsoft);display:flex;justify-content:space-between}
.frame .tag .b{font-weight:700;color:var(--t1)}
/* ===== app primitives — REAL architecture ===== */
.app{background:var(--bg);color:var(--t1);display:flex;flex-direction:column;min-height:520px}
.apphead{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--bd)}
.icobtn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--t1);font-size:19px;cursor:pointer;display:grid;place-items:center}
.icobtn:hover{background:var(--s2)}
.apphead .tt b{font-size:16px;font-weight:800;letter-spacing:-.01em;display:block}
.apphead .tt span{font-size:11.5px;color:var(--t3)}
.apphead .sp{flex:1}
.tabsrow{display:flex;gap:6px;padding:10px 16px;border-bottom:1px solid var(--bdsoft);overflow-x:auto}
.tabsrow button{border:0;background:transparent;font:inherit;font-size:13.5px;font-weight:600;color:var(--t2);padding:9px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tabsrow button.on{background:var(--s2);color:var(--t1)}
.chatlog{flex:1;padding:20px 16px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.daydiv{align-self:center;font-size:11.5px;font-weight:600;color:var(--t3);background:var(--s2);padding:4px 12px;border-radius:999px}
.bub{max-width:78%;padding:12px 15px;border-radius:18px;font-size:14.5px;line-height:1.7}
.bub.u{background:var(--ac);color:var(--ac-tx);align-self:flex-end;border-end-end-radius:6px}
.bub.a{background:var(--s1);border:1px solid var(--bd);align-self:flex-start;border-end-start-radius:6px;box-shadow:var(--sh1)}
.bub.a .ai{font-size:11px;font-weight:700;color:var(--blue-tx);letter-spacing:.04em;margin-bottom:5px}
.bub .moveb{display:inline-block;margin-top:8px;font-size:12.5px;font-weight:600;background:var(--blue-soft);color:var(--blue-tx);padding:6px 12px;border-radius:999px}
.sug{display:flex;gap:8px;flex-wrap:wrap}
.sug button{border:1px solid var(--bd);background:var(--s1);font:inherit;font-size:13px;font-weight:600;color:var(--t1);padding:9px 15px;border-radius:999px;cursor:pointer}
.sug button:hover{border-color:var(--blue);color:var(--blue-tx)}
.composer{padding:12px 16px calc(12px + 2px);border-top:1px solid var(--bdsoft)}
.comp-box{display:flex;align-items:flex-end;gap:8px;background:var(--s1);border:1px solid var(--bd);border-radius:26px;padding:6px;box-shadow:var(--sh1)}
.comp-box .in{flex:1;padding:9px 6px;font-size:14.5px;color:var(--t3)}
.cbtn{width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:var(--t2);font-size:18px;cursor:pointer;display:grid;place-items:center;flex-shrink:0}
.send{width:42px;height:42px;border-radius:50%;border:0;background:var(--ac);color:var(--ac-tx);font-size:17px;cursor:pointer;display:grid;place-items:center;flex-shrink:0}
/* sidebar (desktop) = drawer destinations */
.layout{display:flex;min-height:560px}
.sidebar{width:272px;flex-shrink:0;border-inline-end:1px solid var(--bd);background:var(--s1);display:flex;flex-direction:column;padding:16px 12px;gap:2px}
.prof{display:flex;gap:11px;align-items:center;padding:8px 10px 14px;border-bottom:1px solid var(--bdsoft);margin-bottom:10px}
.prof .av{width:42px;height:42px;border-radius:50%;background:#3a3a3e;color:#fff;display:grid;place-items:center;font-weight:700}
.prof b{font-size:14px;display:block}.prof span{font-size:11.5px;color:var(--t3)}
.badge{font-size:10.5px;font-weight:700;background:var(--sage-soft);color:var(--sage);padding:2px 8px;border-radius:999px}
.mi{display:flex;align-items:center;gap:11px;padding:10px;border-radius:11px;font-size:14px;font-weight:550;color:var(--t1);cursor:pointer}
.mi:hover{background:var(--s2)}.mi .e{font-size:16px;width:22px;text-align:center}.mi .r{margin-inline-start:auto;font-size:11.5px;color:var(--t3)}
.mi.danger{color:#C23B2E}[data-theme="dark"] .mi.danger{color:#E07B5A}
.newchat{margin:6px 4px 12px;background:var(--ac);color:var(--ac-tx);border:0;font:inherit;font-weight:700;font-size:14px;padding:12px;border-radius:12px;cursor:pointer;width:calc(100% - 8px)}
.hist-t{font-size:11px;font-weight:700;color:var(--t3);letter-spacing:.06em;padding:8px 10px 4px}
.hist{display:flex;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:10px;font-size:13.5px;color:var(--t2);cursor:pointer}
.hist:hover,.hist.on{background:var(--s2);color:var(--t1)}.hist .x{color:var(--t3)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.main .chatlog{max-width:760px;width:100%;margin:0 auto}
.main .composer{max-width:760px;width:100%;margin:0 auto;border-top:0}
/* drawer (mobile) */
.mobwrap{position:relative;max-width:390px;margin:0 auto;border-radius:34px;border:10px solid #1a1a1c;overflow:hidden;box-shadow:var(--sh3)}
.mobwrap .app{min-height:600px}
.drawer{position:absolute;inset:0;display:flex;z-index:5}
.drawer .scrim{flex:1;background:var(--scrim)}
.drawer .panel{width:300px;background:var(--s1);box-shadow:var(--sh3);padding:16px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
[dir="ltr"] .drawer{flex-direction:row-reverse}
/* space view */
.spacetabs{display:flex;gap:6px;padding:12px 16px 0;overflow-x:auto}
.spacetabs button{border:1px solid var(--bd);background:var(--s1);font:inherit;font-size:13px;font-weight:600;color:var(--t2);padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.spacetabs button.on{background:var(--ac);color:var(--ac-tx);border-color:transparent}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;padding:18px 16px 24px}
.mcard{border:1px solid var(--bd);border-radius:16px;overflow:hidden;background:var(--s1);box-shadow:var(--sh1)}
.mph{height:110px;display:grid;place-items:end start;padding:10px;color:#fff;font-size:12px;font-weight:600;position:relative}
.mph::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--scrim),transparent 55%)}
.mph span{position:relative;z-index:1}
.mph.g1{background:linear-gradient(135deg,#26262b,#4b4b52)}.mph.g2{background:linear-gradient(135deg,#333338,#5c5c64)}.mph.g3{background:linear-gradient(135deg,#1e1e22,#43434b)}
.mbody{padding:13px 15px}.mbody h4{font-size:14.5px;font-weight:700;margin-bottom:4px}
.mbody .meta{font-size:12px;color:var(--t3);display:flex;gap:8px;align-items:center}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--s2);color:var(--t2)}
.pill.b{background:var(--blue-soft);color:var(--blue-tx)}.pill.s{background:var(--sage-soft);color:var(--sage)}
/* detail */
.det-hero{height:250px;display:grid;place-items:end start;padding:22px;color:#fff;background:linear-gradient(135deg,#232327,#4e4e56);position:relative}
.det-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(5,5,6,.72),transparent 60%)}
.det-hero .in{position:relative;z-index:1}.det-hero h2{font-size:27px;font-weight:800;margin-bottom:6px}
.det-body{padding:20px 22px 26px;max-width:680px}
.det-body .txt{font-size:15.5px;line-height:1.85;margin-bottom:18px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.fact{background:var(--s2);border-radius:12px;padding:11px 13px}.fact .k{font-size:11px;font-weight:700;color:var(--t3);margin-bottom:3px}.fact .v{font-size:13.5px;font-weight:600}
/* family */
.fam{padding:20px 16px 26px}
.members{display:grid;gap:9px;margin-bottom:20px}
.mem{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--bd);border-radius:14px;background:var(--s1)}
.mem .av2{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff}
.mem h4{font-size:14px;font-weight:700}.mem span{font-size:12px;color:var(--t3)}.mem .r{margin-inline-start:auto}
/* brand sheet */
.sheet{padding:28px 24px;max-width:760px}
.kick{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--t3);text-transform:uppercase;margin-bottom:12px}
.wm{font-size:50px;font-weight:800;letter-spacing:-.03em}
.tagline{font-size:15px;color:var(--t2);margin:4px 0 24px}
.icons{display:flex;gap:18px;margin-bottom:24px}
.appicon{width:92px;height:92px;border-radius:25px;display:grid;place-items:center;box-shadow:var(--sh2)}
.appicon.a{background:var(--ac);color:var(--ac-tx);font-size:42px;font-weight:800}
.appicon.b{background:var(--s2);border:1px solid var(--bd);font-size:38px}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.sw{border:1px solid var(--bd);border-radius:12px;overflow:hidden}.sw .c{height:52px}
.sw .t{padding:7px 10px;font-size:11px;color:var(--t2)}.sw .t b{display:block;color:var(--t1);font-size:12px}
.foot{max-width:1180px;margin:0 auto;padding:26px 28px 60px;color:var(--t3);font-size:13px;line-height:1.8;border-top:1px solid var(--bd)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="hdr">
  <div class="brand"><div class="mark" id="hdrMark">م</div>
    <div><h1 id="hdrT"></h1><div class="sub" id="hdrS"></div></div></div>
  <div class="ctl">
    <div class="seg" id="segL"><button data-l="ar" class="on">العربية</button><button data-l="en">English</button></div>
    <div class="seg" id="segT"><button data-t="light" class="on">☀︎ <span>فاتح</span></button><button data-t="dark">☾ <span>داكن</span></button></div>
  </div>
</header>
<div class="note" id="noteBox"></div>
<div class="wrap" id="stages"></div>
<div class="foot" id="footBox"></div>

<script>
let L='ar', TH='light'; const ar=()=>L==='ar';
const T={
 ar:{title:'Mawjood · تصحيح معمارية UX — محادثة أولاً',sub:'Decision #12 · البنية الحالية محفوظة · تنسيق v1.2',
  note:'<b>تصحيح معمارية (قرار المالك #12):</b> الصفحة الرئيسية تبقى <b>واجهة محادثة الذكاء الاصطناعي</b> كما هي في التطبيق الحالي — لا لوحة تحكم. التنقّل: قائمة جانبية (سطح مكتب) / درج منزلق (جوال) بنفس الوجهات الحالية، وصف تبويبات المساحات. هذه الحزمة تعيد رسم البنية <b>الحقيقية</b> بتنسيق v1.2.',
  brand:'الهوية والشعار',brandD:'كما في v1.2 — شعار معاصر وأيقونتان أحاديّتا اللون ولوحة الألوان.',
  chatD:'الرئيسية = المحادثة',chatDD:'سطح المكتب: شريط جانبي (نفس وجهات الدرج) + منطقة محادثة واسعة. الجوال: محادثة أولاً + درج منزلق مفتوحاً للعرض.',
  space:'مساحة خاصة',spaceD:'عرض مساحة من تبويبات الأعلى — تبويباتها الداخلية: ملاحظات / أشياء / أوراق + تبويبات مخصصة.',
  detail:'تفاصيل الذكرى',detailD:'ذكرى واحدة بتركيز كامل — تفتح من المساحة أو من روابط المحادثة.',
  family:'مساحة العائلة',familyD:'تبويبات عائلية مدمجة: أعضاء / تسوق / مهام / أجندة / أشياء / ملاحظات.',
  desktop:'سطح المكتب',mobile:'جوال',foot:'حزمة مراجعة فقط — ليست كود تطبيق. البنية تعكس التطبيق الحالي (index.tsx)؛ الوجهات كما هي بلا إضافة/حذف/إعادة تسمية. الشعار النهائي والقرارات التجارية ما زالت مفتوحة. لا دمج، لا نشر، لا D1.'},
 en:{title:'Mawjood · UX Architecture Correction — Chat-First',sub:'Decision #12 · existing structure preserved · v1.2 styling',
  note:'<b>Architecture correction (Owner Decision #12):</b> home remains the <b>AI Agent chat interface</b> exactly as in the current app — no dashboard. Navigation: sidebar (desktop) / slide-in drawer (mobile) with the same existing destinations, plus the spaces tabs row. This package re-renders the <b>real</b> architecture in v1.2 styling.',
  brand:'Brand & logo',brandD:'As v1.2 — contemporary wordmark, two monochrome icons, palette.',
  chatD:'Home = chat',chatDD:'Desktop: sidebar (the drawer destinations) + spacious conversation area. Mobile: chat-first + the drawer shown open.',
  space:'Private space',spaceD:'A space opened from the top tabs row — its inner tabs: Notes / Things / Papers + custom tabs.',
  detail:'Memory detail',detailD:'One memory, full attention — opened from a space or from chat links.',
  family:'Family space',familyD:'Built-in family tabs: Members / Shopping / Tasks / Agenda / Things / Notes.',
  desktop:'Desktop',mobile:'Mobile',foot:'Review package only — not application code. Architecture mirrors the current app (index.tsx); destinations unchanged — none added, removed, or renamed. Final logo and commercial decisions remain open. No merge, no deploy, no D1.'}};

function drawerItemsHTML(){const a=ar();
 const items=[
  ['👤',a?'الملف الشخصي':'Profile',''],['✉️',a?'دعوة':'Invite',a?'للمديرين':'managers'],
  ['👨‍👩‍👧',a?'العائلات':'Families',a?'العائلة':'Family'],['💳',a?'الاشتراك':'Subscription',a?'قريباً':'soon'],
  ['🌐',a?'اللغة':'Language',a?'EN':'عربي'],[TH==='dark'?'🌙':'☀️',a?'المظهر':'Theme',a?(TH==='dark'?'داكن':'فاتح'):(TH==='dark'?'Dark':'Light')],
  ['🔊',a?'الرد الصوتي':'Voice reply','✓'],['ℹ️',a?'حول':'About',''],
  ['📥',a?'تصدير بياناتي':'Export my data',''],['🗑️',a?'حذف الحساب':'Delete account','danger']];
 const hist=a?['وين جواز السفر؟','ملخص الأسبوع','مفاتيح السيارة']:['Where is the passport?','Weekly summary','Car keys'];
 return `<div class="prof"><div class="av">${a?'ر':'R'}</div><div><b>${a?'رزق':'Rezeq'}</b><span>rezeq@…</span></div><span class="badge">${a?'دائم':'Permanent'}</span></div>
 <button class="newchat">＋ ${a?'محادثة جديدة':'New chat'}</button>
 ${items.map(i=>`<div class="mi${i[2]==='danger'?' danger':''}"><span class="e">${i[0]}</span>${i[1]}${i[2]&&i[2]!=='danger'?`<span class="r">${i[2]}</span>`:''}</div>`).join('')}
 <div class="hist-t">${a?'سجل المحادثات':'CHAT HISTORY'}</div>
 ${hist.map((h,i)=>`<div class="hist${i===0?' on':''}"><span>${h}</span><span class="x">✕</span></div>`).join('')}
 <div class="mi"><span class="e">🗑️</span>${a?'سلة المحذوفات':'Trash'}</div>
 <div class="mi"><span class="e">🚪</span>${a?'تسجيل الخروج':'Log out'}</div>`;}

function tabsRow(active){const a=ar();
 const tabs=[['chat','🏠 '+(a?'الرئيسية':'Home')],['private','🔒 '+(a?'خاص':'Private')],['family','👨‍👩‍👧 '+(a?'العائلة':'Family')],['work','💼 '+(a?'العمل':'Work')]];
 return `<div class="tabsrow">${tabs.map(t=>`<button class="${t[0]===active?'on':''}">${t[1]}</button>`).join('')}</div>`;}

function chatLogHTML(){const a=ar();
 return `<div class="chatlog">
 <div class="daydiv">${a?'اليوم':'Today'}</div>
 <div class="bub u">${a?'وين حطيت جواز السفر؟':'Where did I put the passport?'}</div>
 <div class="bub a"><div class="ai">✦ ${a?'موجود':'Mawjood'}</div>${a?'جواز سفرك في الدرج العلوي من مكتب غرفة النوم — سجّلت ذلك في ٣ سبتمبر.':'Your passport is in the top drawer of the bedroom desk — recorded Sep 3.'}</div>
 <div class="bub u">${a?'اشترينا حليب وبيض للبيت':'We bought milk and eggs for home'}<span class="moveb">${a?'نقل للعائلة؟':'Move to Family?'}</span></div>
 <div class="bub a"><div class="ai">✦ ${a?'موجود':'Mawjood'}</div>${a?'حفظتها في مساحتك الخاصة. تبغى أنقلها لقائمة تسوق العائلة؟':'Saved to your Private space. Want me to move it to the family shopping list?'}</div>
 <div class="sug"><button>🎙 ${a?'سجّل صوتاً':'Voice note'}</button><button>${a?'لخّص أسبوعي':'Summarize my week'}</button><button>${a?'وين مفاتيح السيارة؟':'Where are the car keys?'}</button></div>
 </div>
 <div class="composer"><div class="comp-box"><button class="cbtn">📷</button><div class="in">${a?'اكتب أو سجّل ذكرى…':'Type or record a memory…'}</div><button class="cbtn">🎙</button><button class="send">↑</button></div></div>`;}

function appHead(){const a=ar();
 return `<div class="apphead"><button class="icobtn">☰</button><div class="tt"><b>${a?'موجود':'Mawjood'}</b><span>Lost it? Mawjood.</span></div><div class="sp"></div><button class="icobtn">🧪</button></div>`;}

function chatDesktop(){return `<div class="app"><div class="layout">
 <div class="sidebar">${drawerItemsHTML()}</div>
 <div class="main">${appHead()}${tabsRow('chat')}${chatLogHTML()}</div>
 </div></div>`;}

function chatMobile(){const a=ar();
 return `<div class="mobwrap"><div class="app">${appHead()}${tabsRow('chat')}${chatLogHTML()}
 <div class="drawer"><div class="panel">${drawerItemsHTML()}</div><div class="scrim"></div></div>
 </div></div>`;}

function spaceMock(mode){const a=ar();const mob=mode==='mobile';
 const tabs=a?['ملاحظات','أشياء','أوراق','📁 وصفات']:['Notes','Things','Papers','📁 Recipes'];
 const cards=[{t:a?'وصفة الكنافة':'Knafeh recipe',m:a?'قبل يومين':'2 days ago',c:'g2'},{t:a?'جواز السفر — الدرج العلوي':'Passport — top drawer',m:a?'٣ سبتمبر':'Sep 3',c:'g1'},{t:a?'فاتورة الكهرباء':'Electricity bill',m:a?'الأسبوع الماضي':'Last week',c:'g3'}];
 return `<div class="${mob?'mobwrap':''}"><div class="app">${appHead()}${tabsRow('private')}
 <div class="spacetabs">${tabs.map((t,i)=>`<button class="${i===0?'on':''}">${t}</button>`).join('')}</div>
 <div class="cards">${cards.map(c=>`<div class="mcard"><div class="mph ${c.c}"><span>📷</span></div><div class="mbody"><h4>${c.t}</h4><div class="meta"><span>${c.m}</span><span class="pill">${a?'خاص':'Private'}</span></div></div></div>`).join('')}</div>
 </div></div>`;}

function detailMock(mode){const a=ar();const mob=mode==='mobile';
 return `<div class="${mob?'mobwrap':''}"><div class="app">${appHead()}${tabsRow('family')}
 <div class="det-hero"><div class="in"><div style="font-size:12px;font-weight:700;opacity:.8">${a?'مساحة العائلة':'Family space'}</div><h2>${a?'عيد ميلاد سارة':'Sara\u2019s birthday'}</h2><div style="font-size:13px;opacity:.85">${a?'١١ أكتوبر ٢٠٢٦ · ١٢ صورة':'Oct 11, 2026 · 12 photos'}</div></div></div>
 <div class="det-body"><p class="txt">${a?'احتفلنا بعيد ميلاد سارة في حديقة البيت. أحمد أحضر الكعكة، والأم جهّزت الكنافة.':'We celebrated Sara\u2019s birthday in the garden. Ahmad brought the cake; Mom made knafeh.'}</p>
 <div class="facts"><div class="fact"><div class="k">${a?'الأشخاص':'People'}</div><div class="v">${a?'سارة، أحمد، الأم':'Sara, Ahmad, Mom'}</div></div><div class="fact"><div class="k">${a?'المكان':'Place'}</div><div class="v">${a?'حديقة البيت':'Home garden'}</div></div><div class="fact"><div class="k">${a?'التاريخ':'Date'}</div><div class="v">${a?'١١ أكتوبر':'Oct 11'}</div></div></div></div>
 </div></div>`;}

function familyMock(mode){const a=ar();const mob=mode==='mobile';
 const tabs=a?['الأعضاء','التسوق','المهام','الأجندة','الأشياء','الملاحظات']:['Members','Shopping','Tasks','Agenda','Things','Notes'];
 const members=a?[{n:'رزق',r:'مدير',i:'ر'},{n:'الأم',r:'عضو',i:'ا'},{n:'أحمد',r:'عضو',i:'أ'},{n:'سارة',r:'عضو',i:'س'}]:[{n:'Rezeq',r:'Admin',i:'R'},{n:'Mom',r:'Member',i:'M'},{n:'Ahmad',r:'Member',i:'A'},{n:'Sara',r:'Member',i:'S'}];
 const cols=['#3f3f46','#52525b','#71717a','#3b3b40'];
 return `<div class="${mob?'mobwrap':''}"><div class="app">${appHead()}${tabsRow('family')}
 <div class="spacetabs">${tabs.map((t,i)=>`<button class="${i===0?'on':''}">${t}</button>`).join('')}</div>
 <div class="fam"><div class="members">${members.map((m,i)=>`<div class="mem"><div class="av2" style="background:${cols[i]}">${m.i}</div><div><h4>${m.n}</h4><span>${m.r}</span></div><div class="r"><span class="pill s">${a?'نشط':'Active'}</span></div></div>`).join('')}</div>
 <button class="newchat" style="width:100%;margin:0">✉️ ${a?'دعوة عضو':'Invite member'}</button></div>
 </div></div>`;}

function brandMock(){const a=ar();
 const sw=(c,n,h)=>`<div class="sw"><div class="c" style="background:${c}"></div><div class="t"><b>${n}</b>${h}</div></div>`;
 return `<div class="app" style="min-height:0"><div class="sheet">
 <div class="kick">${a?'الهوية':'Brand'}</div><div class="wm">${a?'موجود':'Mawjood'}</div>
 <div class="tagline">${a?'ذكرياتك، حاضرة دائماً.':'Your memories, always present.'}</div>
 <div class="icons"><div class="appicon a">${a?'م':'M'}</div><div class="appicon b">◈</div></div>
 <div class="swatches">${sw('#FFFFFF','bg','#FFF/#0A0A0B')}${sw('#F5F5F6','surface-2','#F5F5F6/#1C1C1F')}${sw('#0A0A0B','accent','#0A0A0B/#FFF')}${sw('#3B82C4','blue · sparing','#3B82C4')}${sw('#5E7E63','sage · sparing','#5E7E63')}${sw('#E7E7EA','border','#E7E7EA/#2A2A2E')}</div>
 </div></div>`;}

function render(){const t=T[L];
 document.documentElement.lang=L;document.documentElement.dir=ar()?'rtl':'ltr';
 document.documentElement.dataset.theme=TH;document.title=t.title;
 document.getElementById('hdrT').textContent=t.title;document.getElementById('hdrS').textContent=t.sub;
 document.getElementById('hdrMark').textContent=ar()?'م':'M';
 document.getElementById('noteBox').innerHTML=`${t.note}<div class="chips"><span class="chip">💬 chat-first home</span><span class="chip">☰ drawer / sidebar</span><span class="chip blue">${ar()?'أزرق ناعم · باعتدال':'soft blue · sparing'}</span><span class="chip sage">${ar()?'مريمية · باعتدال':'sage · sparing'}</span><span class="chip">Decision #12</span></div>`;
 document.querySelectorAll('#segL button').forEach(b=>b.classList.toggle('on',b.dataset.l===L));
 document.querySelectorAll('#segT button').forEach(b=>b.classList.toggle('on',b.dataset.t===TH));
 document.querySelectorAll('#segT button span')[0].textContent=ar()?'فاتح':'Light';
 document.querySelectorAll('#segT button span')[1].textContent=ar()?'داكن':'Dark';
 const sections=[
  ['brand',t.brand,t.brandD,`<div class="frame"><div class="tag"><span class="b">${t.brand}</span></div>${brandMock()}</div>`,false],
  ['chatD',t.chatD,t.chatDD,`<div class="frame"><div class="tag"><span class="b">${t.chatD}</span><span>${t.desktop}</span></div>${chatDesktop()}</div><div class="frame"><div class="tag"><span class="b">${t.chatD}</span><span>${t.mobile} · ${ar()?'الدرج مفتوح':'drawer open'}</span></div>${chatMobile()}</div>`,true],
  ['space',t.space,t.spaceD,`<div class="frame"><div class="tag"><span class="b">${t.space}</span><span>${t.desktop}</span></div>${spaceMock('desktop')}</div><div class="frame"><div class="tag"><span class="b">${t.space}</span><span>${t.mobile}</span></div>${spaceMock('mobile')}</div>`,true],
  ['detail',t.detail,t.detailD,`<div class="frame"><div class="tag"><span class="b">${t.detail}</span><span>${t.desktop}</span></div>${detailMock('desktop')}</div><div class="frame"><div class="tag"><span class="b">${t.detail}</span><span>${t.mobile}</span></div>${detailMock('mobile')}</div>`,true],
  ['family',t.family,t.familyD,`<div class="frame"><div class="tag"><span class="b">${t.family}</span><span>${t.desktop}</span></div>${familyMock('desktop')}</div><div class="frame"><div class="tag"><span class="b">${t.family}</span><span>${t.mobile}</span></div>${familyMock('mobile')}</div>`,true]];
 document.getElementById('stages').innerHTML=sections.map((s,i)=>`<div class="sec"><div class="sec-h"><span class="n">0${i+1}</span><h2>${s[1]}</h2></div><p class="d">${s[2]}</p><div class="stage${s[4]?' cols2':''}">${s[3]}</div></div>`).join('');
 document.getElementById('footBox').textContent=t.foot;}
document.getElementById('segL').addEventListener('click',e=>{if(e.target.dataset.l){L=e.target.dataset.l;render();}});
document.getElementById('segT').addEventListener('click',e=>{if(e.target.dataset.t){TH=e.target.dataset.t;render();}});
render();
</script>
</body>
</html>
