<!DOCTYPE html>
<html lang="ar" dir="rtl" id="root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mawjood — Visual Design Review Package (Direction A+B Approved)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ MAWJOOD A+B FUSION TOKENS (v1.1 approved) ============ */
:root{
  --bg:#FAF6EE; --surface-1:#FFFFFF; --surface-2:#F3EDE1; --surface-soft:#F7F1E5;
  --border:#E7DECF; --border-soft:#EFE7D6;
  --text-1:#211A13; --text-2:#5C5245; --text-3:#75664F;
  --accent:#B4471F; --accent-ink:#8C3415; --accent-pressed:#8C3415;
  --sage:#5F7A5E; --sage-soft:#E4EADF; --sage-dark:#8FAE8D;
  --gold:#C9963C; --success:#3E7C4F; --danger:#B3372C;
  --focus-ring:#8C3415; --scrim:rgba(33,26,19,.45);
  --shadow-1:0 1px 2px rgba(33,26,19,.06); --shadow-2:0 4px 16px rgba(33,26,19,.08); --shadow-3:0 12px 32px rgba(33,26,19,.14);
  --font-ui:'Inter','IBM Plex Sans Arabic',system-ui,sans-serif;
  --font-display:'Fraunces','Noto Naskh Arabic',serif;
  --font-ar-ui:'IBM Plex Sans Arabic','Inter',system-ui,sans-serif;
  --font-ar-display:'Noto Naskh Arabic','Fraunces',serif;
}
[data-theme="dark"]{
  --bg:#16120D; --surface-1:#221B13; --surface-2:#2A2117; --surface-soft:#262017;
  --border:#3A2F22; --border-soft:#33291D;
  --text-1:#F4EDE1; --text-2:#C4B7A3; --text-3:#A89A83;
  --accent:#E07B4A; --accent-ink:#E07B4A; --accent-pressed:#C96A38;
  --sage:#8FAE8D; --sage-soft:#2C362B;
  --gold:#D9A94F; --success:#7CBF8A; --danger:#E07B5A;
  --focus-ring:#E07B4A; --scrim:rgba(10,8,5,.55);
  --shadow-1:0 1px 2px rgba(0,0,0,.35); --shadow-2:0 4px 16px rgba(0,0,0,.45); --shadow-3:0 12px 32px rgba(0,0,0,.55);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text-1);font-family:var(--font-ui);line-height:1.5;transition:background .3s,color .3s}
[dir="rtl"] body, [dir="rtl"] .mock{font-family:var(--font-ar-ui)}
/* ============ REVIEW CHROME ============ */
.review-bar{position:sticky;top:0;z-index:100;background:var(--surface-1);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow-1)}
.review-bar h1{font-family:var(--font-display);font-size:20px;font-weight:600}
[dir="rtl"] .review-bar h1{font-family:var(--font-ar-display)}
.review-bar .controls{display:flex;gap:8px;margin-inline-start:auto;flex-wrap:wrap}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--text-2);font:inherit;font-size:13px;font-weight:600;padding:7px 14px;border-radius:9px;cursor:pointer;transition:all .15s}
.seg button.on{background:var(--surface-1);color:var(--text-1);box-shadow:var(--shadow-1)}
.seg button:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.stage{max-width:1280px;margin:0 auto;padding:40px 24px}
.stage-head{margin-bottom:28px}
.stage-head .kicker{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:8px}
.stage-head h2{font-family:var(--font-display);font-size:32px;font-weight:600;line-height:1.25;margin-bottom:8px}
[dir="rtl"] .stage-head h2{font-family:var(--font-ar-display);line-height:1.65}
.stage-head p{color:var(--text-2);max-width:640px;font-size:15px}
.mock-grid{display:grid;gap:32px}
.mock-frame{background:var(--surface-1);border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:var(--shadow-2)}
.mock-frame .frame-label{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.mock-frame .frame-label b{font-size:14px}
.mock-frame .frame-label span{font-size:12px;color:var(--text-3)}
.mock-viewport{background:var(--bg);display:flex;justify-content:center;padding:32px;min-height:400px}
.mock-viewport.mobile .phone{width:375px}
.mock{background:var(--bg);border-radius:12px;overflow:hidden;position:relative}
/* desktop mock */
.mock.desktop{width:100%;max-width:1024px;min-height:640px;border:1px solid var(--border);box-shadow:var(--shadow-2)}
/* phone mock */
.phone{width:375px;min-height:720px;border:1px solid var(--border);border-radius:36px;overflow:hidden;box-shadow:var(--shadow-3);background:var(--bg);position:relative;flex-shrink:0}
.phone .notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:120px;height:28px;background:var(--text-1);border-radius:16px;z-index:5;opacity:.9}
/* ============ APP UI PRIMITIVES ============ */
.app{font-size:15px;color:var(--text-1)}
.app-topbar{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border);background:var(--surface-1)}
.app-topbar .wordmark{font-family:var(--font-display);font-weight:700;font-size:22px;color:var(--accent-ink)}
[dir="rtl"] .app-topbar .wordmark{font-family:var(--font-ar-display)}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--gold));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.searchbar{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px 16px;color:var(--text-3);font-size:14px;display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:13px 22px;font:inherit;font-weight:600;font-size:15px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn-primary{background:var(--accent);color:#fff;box-shadow:var(--shadow-1)}
.btn-primary:active{transform:scale(.97)}
.btn-secondary{background:var(--sage-soft);color:var(--sage)}
.btn-ghost{background:transparent;color:var(--text-2)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--text-2)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow-1)}
.mem-card{background:var(--surface-1);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-1);transition:transform .2s,box-shadow .2s}
.mem-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-2)}
.mem-photo{height:150px;background:linear-gradient(135deg,#D9C7A7,#B49B78 45%,#8FAE8D 130%);position:relative;display:flex;align-items:flex-end}
.mem-photo.alt{background:linear-gradient(135deg,#C9A96A,#B4471F 120%)}
.mem-photo.alt2{background:linear-gradient(135deg,#8FAE8D,#5F7A5E 120%)}
.mem-photo .cap{position:absolute;inset-inline:0;bottom:0;padding:24px 14px 10px;background:linear-gradient(transparent,var(--scrim));color:#fff;font-size:12px;font-weight:600}
.mem-body{padding:14px 16px}
.mem-body h4{font-size:15px;font-weight:600;margin-bottom:4px}
.mem-body .meta{font-size:12px;color:var(--text-3)}
.space-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--sage-soft);color:var(--sage)}
.space-badge.private{background:var(--surface-2);color:var(--text-2)}
.timeline-date{display:flex;align-items:center;gap:12px;margin:26px 0 14px}
.timeline-date .line{flex:1;height:1px;background:var(--border)}
.timeline-date b{font-size:13px;color:var(--text-3);font-weight:700;background:var(--surface-soft);padding:5px 14px;border-radius:999px;border:1px solid var(--border-soft)}
.chat-bubble{max-width:78%;padding:13px 17px;border-radius:18px;font-size:14.5px;line-height:1.6}
.chat-bubble.ai{background:var(--surface-1);border:1px solid var(--border);border-start-start-radius:6px}
.chat-bubble.user{background:var(--accent);color:#fff;border-start-end-radius:6px;margin-inline-start:auto}
.voice-btn{width:64px;height:64px;border-radius:50%;background:var(--accent);color:#fff;border:0;font-size:26px;cursor:pointer;box-shadow:var(--shadow-2);display:flex;align-items:center;justify-content:center;transition:transform .15s}
.voice-btn:active{transform:scale(.93)}
.bottom-nav{display:flex;border-top:1px solid var(--border);background:var(--surface-1);padding:10px 8px calc(10px + env(safe-area-inset-bottom))}
.bottom-nav a{flex:1;text-align:center;font-size:11px;color:var(--text-3);text-decoration:none;font-weight:600;display:flex;flex-direction:column;gap:3px;align-items:center;padding:4px}
.bottom-nav a.on{color:var(--accent-ink)}
.bottom-nav .ico{font-size:20px}
.sheet-handle{width:40px;height:4px;border-radius:2px;background:var(--border);margin:10px auto}
.section-title{font-size:17px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.section-title a{font-size:13px;color:var(--accent-ink);text-decoration:none;font-weight:600}
.gold-note{border-inline-start:3px solid var(--gold);background:var(--surface-soft);padding:12px 16px;border-radius:0 12px 12px 0;font-size:13.5px;color:var(--text-2)}
[dir="ltr"] .gold-note{border-radius:12px 0 0 12px;border-inline-start:0;border-inline-end:3px solid var(--gold)}
/* wordmark */
.wordmark-demo{display:flex;gap:40px;align-items:center;flex-wrap:wrap;padding:32px}
.wm{font-family:var(--font-ar-display);font-size:56px;font-weight:700;color:var(--text-1)}
.wm .dot{color:var(--accent)}
.wm-latin{font-family:var(--font-display);font-size:44px;font-weight:600;letter-spacing:-.01em}
.app-icon{width:120px;height:120px;border-radius:28px;background:linear-gradient(145deg,var(--accent) 0%,#8C3415 100%);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-3);position:relative;overflow:hidden}
.app-icon::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.25),transparent 55%)}
.app-icon span{font-family:var(--font-ar-display);font-size:64px;font-weight:700;color:#fff;position:relative}
.app-icon.alt{background:linear-gradient(145deg,#5F7A5E,#3E5A3D)}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body data-theme="light">
<div class="review-bar">
  <h1 id="rb-title">موجود — حزمة مراجعة التصميم</h1>
  <div class="controls">
    <div class="seg" id="seg-screen"></div>
    <div class="seg" id="seg-lang">
      <button data-lang="ar" class="on">العربية</button><button data-lang="en">English</button>
    </div>
    <div class="seg" id="seg-theme">
      <button data-theme="light" class="on">☀️</button><button data-theme="dark">🌙</button>
    </div>
  </div>
</div>
<div id="stages"></div>
<script>
const S = {lang:'ar', theme:'light'};
const T = {
 ar:{brand:'الهوية والشعار',home:'الرئيسية',timeline:'الخط الزمني',detail:'تفاصيل الذكرى',ai:'المساعد الذكي',family:'مساحة العائلة',
     desktop:'سطح المكتب',mobile:'الجوال',light:'فاتح',dark:'داكن'},
 en:{brand:'Brand & Wordmark',home:'Home Dashboard',timeline:'Memory Timeline',detail:'Memory Detail',ai:'AI Assistant',family:'Family Space',
     desktop:'Desktop',mobile:'Mobile',light:'Light',dark:'Dark'}
};
const screens=['brand','home','timeline','detail','ai','family'];
let cur='brand';
function buildSeg(){
  const el=document.getElementById('seg-screen'); el.innerHTML='';
  screens.forEach(s=>{const b=document.createElement('button');b.textContent=T[S.lang][s];b.dataset.s=s;
    if(s===cur)b.classList.add('on');b.onclick=()=>{cur=s;buildSeg();render();};el.appendChild(b);});
}
function setLang(l){S.lang=l;document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';
  document.querySelectorAll('#seg-lang button').forEach(b=>b.classList.toggle('on',b.dataset.lang===l));
  document.getElementById('rb-title').textContent=l==='ar'?'موجود — حزمة مراجعة التصميم':'Mawjood — Visual Design Review Package';
  buildSeg();render();}
function setTheme(t){S.theme=t;document.documentElement.dataset.theme=t;
  document.querySelectorAll('#seg-theme button').forEach(b=>b.classList.toggle('on',b.dataset.theme===t));}
document.querySelectorAll('#seg-lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
document.querySelectorAll('#seg-theme button').forEach(b=>b.onclick=()=>setTheme(b.dataset.theme));
/* ================= MOCKUP BUILDERS ================= */
function mockShell(inner, label, sub, mode){
  return `<div class="mock-frame"><div class="frame-label"><b>${label}</b><span>${sub}</span></div>
  <div class="mock-viewport ${mode==='mobile'?'mobile':''}">${inner}</div></div>`;
}
function phone(inner){return `<div class="phone"><div class="notch"></div><div class="app" style="padding-top:44px;height:100%;display:flex;flex-direction:column">${inner}</div></div>`;}
function bottomNav(on, L){
  const items=L==='ar'?[['🏠','الرئيسية','home'],['💬','المساعد','ai'],['👨‍👩‍👧','العائلة','family'],['⚙️','الإعدادات','set']]
                      :[['🏠','Home','home'],['💬','Assistant','ai'],['👨‍👩‍👧','Family','family'],['⚙️','Settings','set']];
  return `<div class="bottom-nav">${items.map(i=>`<a class="${i[2]===on?'on':''}"><span class="ico">${i[0]}</span>${i[1]}</a>`).join('')}</div>`;
}
/* ---- BRAND ---- */
function brandMock(L){
  const ar=L==='ar';
  const inner=`
  <div class="mock desktop"><div class="app" style="padding:40px">
    <div class="wordmark-demo">
      <div><div class="wm">موجود<span class="dot">.</span></div>
        <div style="color:var(--text-3);font-size:13px;margin-top:8px">${ar?'الشعار العربي — خط نسخ مع نقطة تراكوتا':'Arabic wordmark — Naskh with terracotta dot'}</div></div>
      <div><div class="wm-latin">Mawjood<span style="color:var(--accent)">.</span></div>
        <div style="color:var(--text-3);font-size:13px;margin-top:8px">${ar?'الشعار اللاتيني — Fraunces':'Latin wordmark — Fraunces'}</div></div>
      <div style="display:flex;gap:20px">
        <div style="text-align:center"><div class="app-icon"><span>م</span></div>
          <div style="color:var(--text-3);font-size:13px;margin-top:10px">${ar?'أيقونة التطبيق — حرف م':'App icon — meem'}</div></div>
        <div style="text-align:center"><div class="app-icon alt"><span>◫</span></div>
          <div style="color:var(--text-3);font-size:13px;margin-top:10px">${ar?'بديل — رف الأرشيف':'Alt — archive shelf'}</div></div>
      </div>
    </div>
    <div class="card" style="margin-top:8px"><div class="section-title">${ar?'لوحة الألوان المعتمدة':'Approved palette'}</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
      ${[['#FAF6EE','Ivory'],['#211A13','Ink'],['#B4471F','Terracotta'],['#8C3415','Terracotta deep'],['#5F7A5E','Sage'],['#E4EADF','Sage soft'],['#C9963C','Gold'],['#F3EDE1','Paper deep']].map(c=>
      `<div style="text-align:center"><div style="width:64px;height:64px;border-radius:14px;background:${c[0]};border:1px solid var(--border)"></div><div style="font-size:11px;color:var(--text-3);margin-top:6px">${c[1]}<br><span dir="ltr">${c[0]}</span></div></div>`).join('')}
      </div></div>
  </div></div>`;
  return mockShell(inner, ar?'الهوية والشعار':'Brand & wordmark', ar?'اتجاه معتمد: أرشيف دافئ + هدوء معاصر':'Approved: Warm Archive + contemporary calm', 'desktop');
}
/* ---- HOME ---- */
function homeMock(L,mode){
  const ar=L==='ar';
  const greet=ar?'مساء الخير، رزق':'Good evening, Rezeq';
  const sub=ar?'لديك ٣ ذكريات جديدة هذا الأسبوع':'3 new memories this week';
  const searchPh=ar?'ابحث في ذكرياتك…':'Search your memories…';
  const spaces=ar?[['🔒','الخاصة','١٢٤'],['👨‍👩‍👧','العائلة','٨٦'],['💼','العمل','٣٧']]:[['🔒','Private','124'],['👨‍👩‍👧','Family','86'],['💼','Work','37']];
  const recentTitle=ar?'أحدث الذكريات':'Recent memories';
  const viewAll=ar?'عرض الكل':'View all';
  const mems=ar?[{t:'عشاء العائلة يوم الجمعة',m:'منذ يومين · العائلة',c:''},{t:'وصفة الكبة من أمي',m:'منذ ٤ أيام · الخاصة',c:'alt'},{t:'اجتماع الموردين',m:'الأسبوع الماضي · العمل',c:'alt2'}]
               :[{t:'Friday family dinner',m:'2 days ago · Family',c:''},{t:"Mom's kibbeh recipe",m:'4 days ago · Private',c:'alt'},{t:'Supplier meeting',m:'Last week · Work',c:'alt2'}];
  const body=`
    <div class="app-topbar"><div class="wordmark">${ar?'موجود':'Mawjood'}</div><span style="color:var(--gold)">.</span>
      <div style="margin-inline-start:auto;display:flex;gap:10px;align-items:center"><span class="chip">✨ ${ar?'اسأل':'Ask'}</span><div class="avatar">ر</div></div></div>
    <div style="padding:20px;flex:1;overflow:hidden">
      <h2 style="font-family:${ar?'var(--font-ar-display)':'var(--font-display)'};font-size:${mode==='mobile'?'26px':'34px'};font-weight:600;line-height:1.4;margin-bottom:6px">${greet}</h2>
      <p style="color:var(--text-2);font-size:14px;margin-bottom:18px">${sub}</p>
      <div class="searchbar">🔍 ${searchPh}</div>
      <div style="display:flex;gap:10px;margin:18px 0;${mode==='mobile'?'flex-direction:column':''}">
        <button class="btn btn-primary" style="flex:1">🎙️ ${ar?'تسجيل ذكرى':'Record memory'}</button>
        <button class="btn btn-secondary">✨ ${ar?'اسأل المساعد':'Ask assistant'}</button>
      </div>
      <div class="section-title">${ar?'المساحات':'Spaces'} <a href="#">${viewAll}</a></div>
      <div style="display:flex;gap:12px;margin-bottom:22px">
        ${spaces.map(s=>`<div class="card" style="flex:1;text-align:center;padding:16px 8px"><div style="font-size:26px">${s[0]}</div><div style="font-weight:700;font-size:14px;margin-top:6px">${s[1]}</div><div style="font-size:12px;color:var(--text-3)">${s[2]} ${ar?'ذكرى':'memories'}</div></div>`).join('')}
      </div>
      <div class="section-title">${recentTitle} <a href="#">${viewAll}</a></div>
      <div style="display:grid;grid-template-columns:repeat(${mode==='mobile'?'1':'3'},1fr);gap:14px">
        ${mems.map(m=>`<div class="mem-card"><div class="mem-photo ${m.c}"><div class="cap">${m.m}</div></div><div class="mem-body"><h4>${m.t}</h4><div class="meta">${m.m}</div></div></div>`).join('')}
      </div>
    </div>
    ${mode==='mobile'?bottomNav('home',L):''}`;
  const inner=mode==='mobile'?phone(body):`<div class="mock desktop">${body}</div>`;
  return mockShell(inner, T[S.lang][ 'home'], `${T[S.lang][mode]} · ${L==='ar'?'RTL':'LTR'}`, mode);
}
/* ---- TIMELINE ---- */
function timelineMock(L,mode){
  const ar=L==='ar';
  const title=ar?'الخط الزمني':'Timeline';
  const filters=ar?['الكل','صور','صوت','ملاحظات']:['All','Photos','Voice','Notes'];
  const groups=ar?[
    {d:'اليوم',items:[{t:'تسجيل صوتي — أفكار المشروع',m:'🎙️ ٢:٣٤ · الخاصة',c:'alt'},{t:'صورة — غروب الشاطئ',m:'📷 العائلة',c:''}]},
    {d:'أمس',items:[{t:'ملاحظة — قائمة التسوق',m:'📝 العائلة',c:'alt2'}]},
    {d:'الأسبوع الماضي',items:[{t:'ذكرى مُعادة — رحلة الصيف',m:'⭐ قبل سنة · الخاصة',c:'',gold:1}]}]
  :[
    {d:'Today',items:[{t:'Voice note — project ideas',m:'🎙️ 2:34 · Private',c:'alt'},{t:'Photo — beach sunset',m:'📷 Family',c:''}]},
    {d:'Yesterday',items:[{t:'Note — shopping list',m:'📝 Family',c:'alt2'}]},
    {d:'Last week',items:[{t:'Resurfaced — summer trip',m:'⭐ A year ago · Private',c:'',gold:1}]}];
  const body=`
    <div class="app-topbar"><div class="wordmark">${ar?'موجود':'Mawjood'}</div><span style="color:var(--gold)">.</span>
      <div style="margin-inline-start:auto"><div class="avatar">ر</div></div></div>
    <div style="padding:20px;flex:1;overflow:hidden">

          ${it.gold?`<div class="gold-note">✨ ${ar?'ذكرى من هذا اليوم قبل سنة':'A memory from this day, a year ago'}</div>`:''}

  const inner=mode==='mobile'?phone(body):`<div class="mock desktop">${body}</div>`;
  return mockShell(inner, T[S.lang]['timeline'], `${T[S.lang][mode]} · ${L==='ar'?'RTL':'LTR'}`, mode);
}

        </div>
      </div>
    </div>

  return mockShell(inner, T[S.lang]['detail'], `${T[S.lang][mode]} · ${L==='ar'?'RTL':'LTR'}`, mode);

/* ================= RENDER ================= */
function render(){
  const st=document.getElementById('stages'); const L=S.lang; const ar=L==='ar';
  const descs={
   brand:ar?['الهوية والشعار المعتمدة','الاتجاه A — أرشيف دافئ + هدوء B المعاصر. الشعار، الأيقونة، ولوحة الألوان المعتمدة.']:['',''],
   home:ar?['الرئيسية — لوحة التحكم','تحية دافئة، بحث، تسجيل صوتي بارز، المساحات، وأحدث الذكريات.']:['',''],
   timeline:ar?['الخط الزمني','أرشيف زمني بروح رف الذكريات، فلاتر، ولحظة "ذكرى مُعادة" بلون ذهبي.']:['',''],
   detail:ar?['تفاصيل الذكرى','صورة بطولية، النص، العناصر المستخرجة، والذكريات المرتبطة.']:['',''],
   ai:ar?['المساعد الذكي','محادثة مبنية على ذكرياتك، اقتراحات، ومدخل "اسأل خزنتك".']:['',''],
   family:ar?['مساحة العائلة','الأعضاء، الدعوات، والمحتوى المشترك — بهوية المريمية الهادئة.']:['','']};
  const builders={brand:()=>brandMock(L),home:()=>homeMock(L,'desktop')+homeMock(L,'mobile'),
    timeline:()=>timelineMock(L,'desktop')+timelineMock(L,'mobile'),detail:()=>detailMock(L,'desktop')+detailMock(L,'mobile'),
    ai:()=>aiMock(L,'desktop')+aiMock(L,'mobile'),family:()=>familyMock(L,'desktop')+familyMock(L,'mobile')};
  const d=descs[cur];
  st.innerHTML=`<div class="stage"><div class="stage-head"><div class="kicker">${ar?'حزمة المراجعة البصرية':'Visual review package'} · ${cur==='brand'?(ar?'معتمد':'Approved'):(ar?'اتجاه A+B':'A+B direction')}</div>
    <h2>${T[L][cur]}</h2><p>${d[1]||''}</p></div>
    <div class="mock-grid">${builders[cur]()}</div>
    <div class="card" style="margin-top:32px"><div class="section-title">${ar?'ملاحظات المراجعة':'Review notes'}</div>
    <p style="font-size:14px;color:var(--text-2)">${ar?'هذه نماذج عالية الدقة للمراجعة فقط — ليست كود التطبيق. بدّل اللغة والوضع (فاتح/داكن) من الأعلى لرؤية كل الحالات. الشعار النهائي والتفاصيل المصقولة بانتظار مراجعتك.':'These are high-fidelity review mockups only — not app code. Toggle language and theme above to see all states. Final logo artwork and polished details await your review.'}</p></div></div>`;
  window.scrollTo({top:0});
}
buildSeg();render();
</script>
